# koryomi.com — migrated from Docker Compose (/opt/compose/koryomi).
#
# The site content and nginx config stay exactly where they are on the host and are
# mounted read-only via hostPath. Nothing is copied: / is ~89% full, and reusing the
# existing paths means the Docker container and this Deployment can serve the same
# files simultaneously during cutover, so rollback is just repointing NPM back.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: koryomi
  labels:
    app: koryomi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: koryomi
  template:
    metadata:
      labels:
        app: koryomi
    spec:
      containers:
        - name: nginx
          # Same image and config as the Docker container, so behaviour is identical.
          # (nginx:alpine listens on 80 as root inside the container; the
          # unprivileged variant listens on 8080 and would need a different config.)
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            # Host file is nginx.conf; nginx expects it at conf.d/default.conf,
            # matching the original `-v .../nginx.conf:/etc/nginx/conf.d/default.conf:ro`
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
      volumes:
        - name: site
          hostPath:
            path: /opt/compose/koryomi/site
            type: Directory
        - name: nginx-conf
          hostPath:
            path: /opt/compose/koryomi/nginx.conf
            type: File
