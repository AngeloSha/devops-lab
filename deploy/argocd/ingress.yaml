# TLS terminates at Nginx Proxy Manager / Cloudflare; argocd-server runs with
# server.insecure=true, so the ingress speaks plain HTTP to the backend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
spec:
  ingressClassName: traefik
  rules:
    - host: argocd.servershelf.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
