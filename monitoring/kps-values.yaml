# kube-prometheus-stack values, sized for a single-node K3s lab sharing a busy
# host. Retention and resources are deliberately capped; storage lands on the
# local-path provisioner (under /data/k3s/storage — NOT the nearly-full root fs).
prometheus:
  prometheusSpec:
    retention: 2d
    retentionSize: 4GB
    # Discover ServiceMonitors/PodMonitors cluster-wide, not only Helm-labeled ones
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        cpu: "1"
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          resources:
            requests:
              storage: 5Gi

alertmanager:
  enabled: false # future round: flip to true and add routes/receivers

prometheusOperator:
  admissionWebhooks:
    # The cert-generation job pulls from ghcr.io, which containerd on this node
    # is currently refused by (403 on the token endpoint). The webhook only
    # validates PrometheusRule resources before admission, so a single-user lab
    # loses nothing by skipping it. Re-enable once the ghcr.io block is fixed.
    enabled: false
  tls:
    # Must be disabled alongside the webhooks: the operator otherwise mounts the
    # TLS secret that the (now absent) cert-generation job would have created.
    enabled: false

grafana:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.servershelf.com

# K3s runs control-plane components in-process (and uses sqlite, not etcd),
# so their dedicated scrape targets don't exist:
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
