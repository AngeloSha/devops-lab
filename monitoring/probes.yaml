# Uptime + TLS-expiry probing for every hostname Nginx Proxy Manager serves.
#
# Split into three groups by how loudly a failure should be treated, and the
# alert rules key off the `probe_group` label rather than naming hosts. Moving a
# host between groups is a one-line edit here and needs no rule change.
#
# The 13 proxy hosts NPM has disabled are deliberately absent — probing them
# would alert forever.
#
# Every Probe MUST carry `release: kps`; the operator's probeSelector is
# matchLabels{release: kps} and silently ignores anything without it.
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: blackbox-public
  namespace: monitoring
  labels:
    release: kps
spec:
  jobName: blackbox-public
  interval: 60s
  scrapeTimeout: 15s
  module: http_web
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
    scheme: http
    path: /probe
  targets:
    staticConfig:
      static:
        - https://angeloshaheen.com
        - https://envelopee.net
        - https://smrtstand.com
        - https://goblinbid.com
        - https://koryomi.com
        - https://wantviews.com
        - https://marlasauermann.com
        - https://shkofit.ai
        - https://supabase.shkofit.ai
        - https://www.marlasauermann.com
        - https://www.shkofit.ai
      labels:
        probe_group: public
  metricRelabelings:
    # probe_ssl_last_chain_info carries subject/issuer/fingerprint as labels and
    # is by far the highest-cardinality thing blackbox emits.
    - action: drop
      sourceLabels: [__name__]
      regex: 'probe_(ssl_last_chain_info|tls_version_info|http_uncompressed_body_length|http_content_length)'
