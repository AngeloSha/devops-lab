---
# Known-broken today. Kept visible in Grafana so recovery is obvious, but alerted
# only at info severity, which the Alertmanager route drops. When one starts
# returning probe_success=1, move it up into blackbox-internal.
#
#   komga / lazylibrarian / lidarr  — 502, NPM host exists but no backing container
#   www.envelopee.net               — no NPM proxy host at all; TLS falls through
#                                     to CN=www.inviteify.net, so the handshake
#                                     aborts and no cert metric is ever emitted
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: blackbox-known-broken
  namespace: monitoring
  labels:
    release: kps
spec:
  jobName: blackbox-known-broken
  # 120s, not 300s: a 300s interval sits exactly on Prometheus' 5-minute lookback
  # boundary, so these targets flicker in and out of instant queries and appear
  # to vanish from Grafana. Only 4 targets, so the cost is negligible.
  interval: 120s
  scrapeTimeout: 15s
  module: http_web
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
    scheme: http
    path: /probe
  targets:
    staticConfig:
      static:
        - https://komga.servershelf.com
        - https://lazylibrarian.servershelf.com
        - https://lidarr.servershelf.com
        - https://www.envelopee.net
      labels:
        probe_group: known_broken
  metricRelabelings:
    # probe_ssl_last_chain_info carries subject/issuer/fingerprint as labels and
    # is by far the highest-cardinality thing blackbox emits.
    - action: drop
      sourceLabels: [__name__]
      regex: 'probe_(ssl_last_chain_info|tls_version_info|http_uncompressed_body_length|http_content_length)'
